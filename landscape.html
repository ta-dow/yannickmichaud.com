<!DOCTYPE html>
<html lang="en">
	<head>
    	<title>Yannick Michaud | Landscape Photography</title>
    	<meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Gabrielle Michaud">
        <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="css/main.css">
        <link rel="icon" type="image" sizes="32x32" href="images/favicon.ico">
    </head>
    <body>
        <header>
            <nav>
                <a href="index.html">
                    <h1>Yannick Michaud</h1>
                </a>

                <span class="navigation" id="nav-menu">
                    <a href="index.html">Home</a>
                    <a href="portraits.html">Portraits</a>
                    <a href="flora.html">Flora</a>
                    <a href="#" class="active">Landscape</a>
                    <a href="wildlife.html">Wildlife</a>
                </span>

                <button class="hamburger-btn" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-menu">
                    <div class="hamburger-line"></div>
                    <div class="hamburger-line"></div>
                </button>
            </nav>
        </header>
        
        <main>
            <section class="gallery">
                <img src="images/nature_14.jpg">
                <img src="images/nature_18.jpg">
                
                <img src="images/nature_16.jpg">
                <img src="images/nature_13.jpg">

                <img src="images/nature_1.jpg">
                <img src="images/nature_6.jpg">
                
                
                <img src="images/nature_15a.jpg">
                <img src="images/nature_3.jpg">
                
            </section>
        </main>
        
        <footer>
            <a href="index.html">Yannick Michaud &copy; <span id="copyrightYear"></span></a>
        </footer>
        
        <script>

            const menuButton = document.querySelector(".hamburger-btn");
            const navigation = document.querySelector(".navigation");
            menuButton.addEventListener("click", () => {
                const isOpen = menuButton.getAttribute("aria-expanded") === "true";
                menuButton.setAttribute("aria-expanded", String(!isOpen));
                menuButton.setAttribute(
                    "aria-label",
                    isOpen ? "Open navigation menu" : "Close navigation menu"
                );
                navigation.classList.toggle("is-open", !isOpen);
                menuButton.classList.toggle("open", !isOpen);
            });
            
            function updateCopyrightYear() {
                const currentYear = new Date().getFullYear();
                document.getElementById("copyrightYear").textContent = currentYear;
            }
            updateCopyrightYear(); 

        </script>
        
    </body>
</html>
